<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Вход — Море Антильское</title>
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div id="box">
  <h1>Море Антильское</h1>

  <div id="auth-box">
    <div class="tabs">
      <div class="tab active" id="tab-login">Вход</div>
      <div class="tab" id="tab-signup">Регистрация</div>
    </div>

    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">

    <label>Пароль</label>
    <input type="password" id="password" placeholder="минимум 6 символов" autocomplete="current-password">

    <button id="submit-btn">Войти</button>
    <div id="message"></div>
  </div>

  <div id="session-box">
    <p>Ты вошёл как <span class="email" id="user-email"></span></p>
    <button id="logout-btn">Выйти</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
