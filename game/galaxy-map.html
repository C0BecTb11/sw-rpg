<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Star Wars: Global Conflict — переезд</title>
<meta http-equiv="refresh" content="6;url=https://c0bectb11.github.io/SW-RPG2.0/game/galaxy-map.html">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0a0d14; color: #cfd8dc; font-family: 'Courier New', monospace; padding: 20px; }
  #box { width: 100%; max-width: 380px; border: 1px solid #1c2530; background: #0e131c; padding: 26px 22px; text-align: center; }
  h1 { font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: #8fa8c4; margin: 0 0 18px; font-weight: normal; }
  p { font-size: 13px; line-height: 1.55; margin: 0 0 12px; color: #9fb0bf; }
  b { color: #cfd8dc; }
  a.go { display: block; margin-top: 20px; padding: 12px; background: #4a90d9; color: #0a0d14; text-decoration: none;
         font-size: 13px; letter-spacing: 1px; text-transform: uppercase; font-weight: bold; border-radius: 2px; }
  .note { margin-top: 14px; font-size: 11px; color: #5d6f80; }
</style>
</head>
<body>
<div id="box">
  <h1>Старая версия закрыта</h1>
  <p>Пошаговые бои <b>версии 1.0</b> отключены. Игра продолжается в <b>версии 2.0</b> — бои в реальном времени.</p>
  <p>Аккаунт, войска и флот те же: войди тем же email и паролем.</p>
  <a class="go" id="go" href="https://c0bectb11.github.io/SW-RPG2.0/game/galaxy-map.html">Перейти в 2.0</a>
  <div class="note">Переход произойдёт автоматически через <span id="sec">6</span> с</div>
</div>
<script>
(function () {
  var url = 'https://c0bectb11.github.io/SW-RPG2.0/game/galaxy-map.html' + location.search + location.hash;
  document.getElementById('go').href = url;
  var n = 6, el = document.getElementById('sec');
  var t = setInterval(function () {
    n--; if (el) el.textContent = n;
    if (n <= 0) { clearInterval(t); location.replace(url); }
  }, 1000);
})();
</script>
</body>
</html>
