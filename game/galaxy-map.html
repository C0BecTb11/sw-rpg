<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Галактика — Star Wars: Global Conflict</title>
<link rel="stylesheet" href="../css/galaxy.css">
<link rel="stylesheet" href="../css/shared-ui.css">
<link rel="stylesheet" href="../css/faction.css">
</head>
<body>

<div id="profile-badge">
  <div id="profile-avatar"></div>
  <span id="profile-nickname">...</span>
</div>

<div id="nickname-prompt" style="display:none;">
  <div id="nickname-prompt-box">
    <p>У этого аккаунта ещё нет игрового ника</p>
    <input type="text" id="nickname-prompt-input" placeholder="придумай ник">
    <button id="nickname-prompt-save">Сохранить</button>
    <div id="nickname-prompt-message"></div>
  </div>
</div>

<div id="faction-waiting" style="display:none;">
  <div id="faction-waiting-box">
    <p class="faction-waiting-title">Ожидание распределения по фракции</p>
    <p class="faction-waiting-text">Сообщи этот код администратору — он назначит тебе фракцию, и игра откроется автоматически.</p>
    <div id="access-code-value">------</div>
  </div>
</div>

<div id="map-scroll">
  <div id="map-area">
    <div id="galaxy-layer"></div>
  </div>
</div>

<div id="bottom-panel">
  <div id="bottom-panel-toggle">
    <span id="bottom-panel-toggle-icon">▾</span>
  </div>
  <div id="bottom-panel-content">
    <button class="panel-item" id="panel-item-faction">
      <div class="panel-item-icon" id="faction-emblem">⬡</div>
      <span class="panel-item-label" id="faction-label">Фракция</span>
    </button>
    <button class="panel-item" id="panel-item-army">
      <div class="panel-item-icon">⚔</div>
      <span class="panel-item-label">Армия</span>
    </button>
  </div>
</div>

<div id="army-screen" style="display:none;">
  <div id="army-screen-header">
    <span class="army-screen-title">Армия</span>
    <button id="army-screen-close">✕</button>
  </div>

  <div class="army-section">
    <div class="army-section-title">Командиры</div>
    <div id="army-commanders-list"></div>
  </div>

  <div class="army-section">
    <div class="army-section-title">Войска по планетам</div>
    <div id="army-garrisons-list"></div>
  </div>
</div>

<div id="planet-info-overlay" style="display:none;">
  <div id="pi-card">
    <div id="pi-planet-strip"></div>
    <button id="pi-close">✕</button>

    <div id="pi-head">
      <div id="pi-name">—</div>
      <div id="pi-faction"></div>
    </div>

    <div id="pi-controller-row">
      <span>Управляет</span>
      <b id="pi-controller">—</b>
    </div>

    <div id="pi-stats"></div>

    <div id="pi-actions">
      <button id="pi-ground-btn" class="pi-action">
        <span class="pi-action-icon">⛰</span>
        <span class="pi-action-text">Земное<br>пространство</span>
      </button>
      <button id="pi-space-btn" class="pi-action">
        <span class="pi-action-icon">✦</span>
        <span class="pi-action-text">Космическое<br>пространство</span>
      </button>
    </div>

    <button id="pi-move-btn" style="display:none;">Отправить командира</button>
  </div>
</div>
</div>

<div id="faction-screen" style="display:none;">
  <div id="faction-screen-box">
    <button id="faction-screen-close">✕</button>
    <div id="faction-screen-name">—</div>

    <div class="faction-section">
      <div class="faction-section-title">Планеты</div>
      <div id="faction-screen-planets" class="faction-screen-text">—</div>
    </div>

    <div class="faction-section">
      <div class="faction-section-title">Лидер фракции</div>
      <div id="faction-screen-leader" class="faction-screen-text">—</div>
    </div>

    <button id="faction-control-open-btn" style="display:none;">Панель управления фракции</button>
  </div>
</div>

<div id="faction-control-screen" style="display:none;">
  <div id="faction-control-header">
    <span class="faction-control-title">Панель управления фракции</span>
    <button id="faction-control-close">✕</button>
  </div>
  <div id="faction-control-list"></div>
</div>

<div id="cargo-panel" style="display:none;">
  <div id="cargo-box">
    <div id="cargo-header">
      <div>
        <div id="cargo-title">Погрузка</div>
        <div id="cargo-subtitle"></div>
      </div>
      <button id="cargo-close">✕</button>
    </div>
    <div id="cargo-capacity" class="cargo-capacity"></div>
    <div id="cargo-list"></div>
  </div>
</div>

<div id="shipcargo-panel" style="display:none;">
  <div id="shipcargo-box">
    <div id="shipcargo-header">
      <div>
        <div id="shipcargo-title">Трюм</div>
        <div id="shipcargo-name"></div>
      </div>
      <button id="shipcargo-close">✕</button>
    </div>
    <div id="shipcargo-tabs">
      <button id="shipcargo-tab-load" class="shipcargo-tab active">Погрузка</button>
      <button id="shipcargo-tab-unload" class="shipcargo-tab">Высадка</button>
    </div>
    <div id="shipcargo-capacity" class="cargo-capacity"></div>
    <div id="shipcargo-list"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/credits-bar.js"></script>
<script src="../js/galaxy.js"></script>
<script src="../js/profile.js"></script>
<script src="../js/bottom-panel.js"></script>
<script src="../js/army.js"></script>
<script src="../js/ship-cargo.js"></script>
<script src="../js/planet-info.js"></script>
<script src="../js/faction-panel.js"></script>
<script src="../js/faction-control.js"></script>
<script src="../js/planets.js"></script>
</body>
</html>
