<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Галактика — Star Wars: Global Conflict</title>
<link rel="stylesheet" href="../css/galaxy.css">
</head>
<body>

<div id="profile-badge">
  <div id="profile-avatar"></div>
  <span id="profile-nickname">...</span>
</div>

<div id="nickname-prompt" style="display:none;">
  <div id="nickname-prompt-box">
    <p>У этого аккаунта ещё нет игрового ника</p>
    <input type="text" id="nickname-prompt-input" placeholder="придумай ник">
    <button id="nickname-prompt-save">Сохранить</button>
    <div id="nickname-prompt-message"></div>
  </div>
</div>

<div id="faction-waiting" style="display:none;">
  <div id="faction-waiting-box">
    <p class="faction-waiting-title">Ожидание распределения по фракции</p>
    <p class="faction-waiting-text">Сообщи этот код администратору — он назначит тебе фракцию, и игра откроется автоматически.</p>
    <div id="access-code-value">------</div>
  </div>
</div>

<div id="map-scroll">
  <div id="map-area">
    <div id="galaxy-layer"></div>
  </div>
</div>

<div id="bottom-panel">
  <div id="bottom-panel-toggle">
    <span id="bottom-panel-toggle-icon">▾</span>
  </div>
  <div id="bottom-panel-content">
    <button class="panel-item" id="panel-item-faction">
      <div class="panel-item-icon" id="faction-emblem">⬡</div>
      <span class="panel-item-label" id="faction-label">Фракция</span>
    </button>
    <button class="panel-item" id="panel-item-army">
      <div class="panel-item-icon">⚔</div>
      <span class="panel-item-label">Армия</span>
    </button>
  </div>
</div>

<div id="army-screen" style="display:none;">
  <div id="army-screen-header">
    <span class="army-screen-title">Армия</span>
    <button id="army-screen-close">✕</button>
  </div>

  <div class="army-section">
    <div class="army-section-title">Юниты</div>
    <div id="army-units-list">
      <div class="army-empty">Пока нет созданных юнитов</div>
    </div>
  </div>

  <div class="army-section">
    <div class="army-section-title">Командиры</div>
    <div id="army-commanders-list"></div>
  </div>
</div>

<div id="planet-info-overlay" style="display:none;">
  <div id="planet-info-box">
    <button id="planet-info-close">✕</button>
    <div id="planet-info-name">—</div>
    <div id="planet-info-faction">—</div>
    <div id="planet-info-controller">—</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/galaxy.js"></script>
<script src="../js/profile.js"></script>
<script src="../js/bottom-panel.js"></script>
<script src="../js/army.js"></script>
<script src="../js/planet-info.js"></script>
<script src="../js/planets.js"></script>
</body>
</html>
