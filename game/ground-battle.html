<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Наземное сражение — Star Wars: Global Conflict</title>
<link rel="stylesheet" href="../css/ground-battle.css">
<link rel="stylesheet" href="../css/drop.css">
<link rel="stylesheet" href="../css/shared-ui.css">
</head>
<body>

<button id="ground-back-btn">← Галактика</button>

<div id="ground-viewport">
  <canvas id="ground-canvas"></canvas>
</div>

<div id="build-panel" style="display:none;">
  <div id="build-panel-box">
    <button id="build-panel-close">✕</button>
    <div class="build-panel-title">Выбери постройку</div>
    <div id="build-panel-list"></div>
  </div>
</div>

<div id="building-info-panel" style="display:none;">
  <div id="building-info-box">
    <button id="building-info-close">✕</button>
    <div id="building-info-name">—</div>
    <div id="building-info-refund"></div>
    <button id="building-info-demolish">Снести</button>
  </div>
</div>

<div id="unit-panel" style="display:none;">
  <div id="unit-panel-box">
    <div id="unit-panel-header">
      <span id="unit-panel-title">Производство</span>
      <button id="unit-panel-close">✕</button>
    </div>
    <div id="unit-panel-capacity" class="unit-panel-capacity"></div>
    <div id="unit-panel-list"></div>
  </div>
</div>

<div id="order-queue" style="display:none;"></div>

<button id="drop-btn" style="display:none;">Высадка</button>

<div id="drop-panel" style="display:none;">
  <div id="drop-panel-box">
    <div id="drop-panel-header">
      <span id="drop-panel-title">Десант на борту</span>
      <button id="drop-panel-close">✕</button>
    </div>
    <div id="drop-panel-list"></div>
  </div>
</div>

<div id="placement-hint" style="display:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/credits-bar.js"></script>
<script src="../js/ground-battle.js"></script>
</body>
</html>
