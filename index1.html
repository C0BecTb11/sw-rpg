<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Море Антильское</title>
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/banner.css">
<style>
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 30px;
  }
  .links a {
    display: block;
    text-align: center;
    padding: 12px;
    background: #4a90d9;
    color: #0a0d14;
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: bold;
    border-radius: 2px;
  }
  .links a.secondary {
    background: #2a3644;
    color: #cfd8dc;
  }
  #status {
    text-align: center;
    font-size: 12px;
    color: #55606c;
    margin-top: 20px;
    min-height: 16px;
  }
</style>
</head>
<body>

<div id="banner-placeholder"></div>

<div id="box">
  <h1>Море Антильское</h1>
  <div id="status">Проверяем сессию...</div>
  <div class="links" id="links" style="display:none;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/banner.js"></script>
<script>
  var statusEl = document.getElementById('status');
  var linksEl = document.getElementById('links');

  supabase.auth.getSession().then(function(res) {
    linksEl.style.display = 'flex';
    if (res.data.session) {
      statusEl.textContent = 'Вошёл как ' + res.data.session.user.email;
      linksEl.innerHTML =
        '<a href="character-create.html">Создать персонажа</a>' +
        '<a href="auth.html" class="secondary">Управление аккаунтом</a>';
    } else {
      statusEl.textContent = 'Ты не авторизован';
      linksEl.innerHTML =
        '<a href="auth.html">Войти / Зарегистрироваться</a>';
    }
  });
</script>
</body>
</html>
